      <h1>Change Computer Name (Device Name)</h1>
      <p>To change your actual network/device name, use Windows settings.</p>
      <ol>
        <li>Open <strong>Start &gt; Settings &gt; System &gt; About</strong>.</li>
        <li>Click <strong>Rename this PC</strong>.</li>
        <li>Enter the new name and restart if prompted.</li>
      </ol>
    </section>
  </main>
